name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # NetCDF/HDF5 support (dv-data's `netcdf` feature) links the system netCDF-C library;
      # dv-render's text layout finds fonts through fontconfig on Linux. dv-grid needs PROJ 9.9:
      # Homebrew has it, and on Ubuntu (older PROJ) proj-sys builds it from source, cached with
      # the rest of target/.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libfontconfig1-dev cmake sqlite3 libtiff-dev
      - if: runner.os == 'macOS'
        run: brew install netcdf proj
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
