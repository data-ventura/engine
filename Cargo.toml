[workspace]
resolver = "3"
members = [
    "crates/dv-data",
    "crates/dv-query",
    "crates/dv-model",
    "crates/dv-grid",
    "crates/dv-compute",
    "crates/dv-render",
    "crates/dv-spec",
    "crates/dv-ext",
    "crates/dv-py",
    "crates/dv-serve",
    "spike",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/data-ventura/engine"
homepage = "https://dataventura.com"
authors = ["Data Ventura contributors"]
# Nothing is published until the M3 milestone (see README).
publish = false

[workspace.dependencies]
dataventura-data = { path = "crates/dv-data", version = "0.0.0" }
dataventura-query = { path = "crates/dv-query", version = "0.0.0" }
dataventura-model = { path = "crates/dv-model", version = "0.0.0" }
dataventura-grid = { path = "crates/dv-grid", version = "0.0.0" }
dataventura-compute = { path = "crates/dv-compute", version = "0.0.0" }
dataventura-render = { path = "crates/dv-render", version = "0.0.0" }
dataventura-spec = { path = "crates/dv-spec", version = "0.0.0" }
dataventura-ext = { path = "crates/dv-ext", version = "0.0.0" }
dataventura-py = { path = "crates/dv-py", version = "0.0.0" }
# Arrow and Parquet follow the versions DataFusion uses, so record batches pass between crates
# without conversion. Upgrade them together with `datafusion`.
arrow = { version = "59.2", default-features = false }
parquet = { version = "59.2", default-features = false }
datafusion = { version = "55.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
