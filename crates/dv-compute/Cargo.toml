[package]
name = "dataventura-compute"
description = "The expression language, window functions, reductions and verification metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_compute"

[lints]
workspace = true

[dependencies]
dataventura-model.workspace = true
arrow = { workspace = true }
datafusion = { workspace = true, features = ["datetime_expressions", "string_expressions", "unicode_expressions"] }
thiserror = "2"

[dev-dependencies]
dataventura-data.workspace = true
dataventura-query.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
