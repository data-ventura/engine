[package]
name = "dataventura-data"
description = "Readers for tables, arrays and geospatial data, plus object storage and SFTP access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_data"

[lints]
workspace = true

[dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time", "rt"] }
libc = "0.2"
arrow = { workspace = true, features = ["prettyprint", "csv", "json", "ipc"] }
parquet = { workspace = true, features = ["arrow", "zstd", "snap", "lz4", "flate2-rust_backend"] }
bytes = "1"
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
glob = "0.3"
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "column_decltype"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rayon = "1.12"
serde_json = "1"
thiserror = "2"
zarrs = { version = "0.23", default-features = false, features = ["async", "blosc"] }
zarrs_object_store = { version = "0.7", default-features = false, features = ["http", "fs"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
