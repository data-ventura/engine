[package]
name = "dataventura-data"
description = "Readers for tables, arrays and geospatial data, plus object storage and SFTP access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_data"

[lints]
workspace = true

[features]
# NetCDF 3/4 and HDF5 through the system netCDF-C library (`brew install netcdf`,
# `apt install libnetcdf-dev`).
netcdf = ["dep:netcdf"]
# Icechunk repositories (Zarr stores with snapshots, branches and tags).
icechunk = ["dep:icechunk", "dep:zarrs_icechunk"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time", "rt", "rt-multi-thread"] }
libc = "0.2"
arrow = { workspace = true, features = ["prettyprint", "csv", "json", "ipc"] }
parquet = { workspace = true, features = ["arrow", "zstd", "snap", "lz4", "flate2-rust_backend"] }
bytes = "1"
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
flatgeobuf = { version = "6", default-features = false }
geozero = { version = "0.15", default-features = false, features = ["with-wkb"] }
glob = "0.3"
netcdf = { version = "0.12", default-features = false, optional = true }
npyz = "0.9"
# `.npz` archives, with the zip version calamine already uses.
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "column_decltype"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rayon = "1.12"
serde_json = "1"
shapefile = "0.9"
thiserror = "2"
url = "2"
# zstd is already built for zarrs; GDAL writes zstd COGs.
tiff = { version = "0.11", features = ["zstd"] }
zarrs = { version = "0.23", default-features = false, features = ["async", "blosc", "gzip", "zlib", "zstd", "crc32c", "adler32", "fletcher32", "sharding", "transpose", "bitround", "pcodec"] }
zarrs_object_store = { version = "0.7", default-features = false, features = ["http", "fs", "aws", "gcp", "azure"] }
icechunk = { version = "2.3", default-features = false, features = ["object-store-s3", "object-store-gcs", "object-store-http", "object-store-fs"], optional = true }
zarrs_icechunk = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
