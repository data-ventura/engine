[package]
name = "dataventura-grid"
description = "Projections, regridding, and curvilinear and unstructured meshes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_grid"

[lints]
workspace = true

[dependencies]
# PROJ 9.9 from the system (pkg-config), or built from source when that's missing or older.
# `tiff` lets a source build read grid files, which are GeoTIFFs.
proj-sys = { version = "0.28", features = ["tiff"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
