[package]
name = "dataventura-query"
description = "Lazy table queries on Apache DataFusion: scans, filters, aggregates and joins by key, time and place."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_query"

[lints]
workspace = true

[dependencies]
dataventura-data.workspace = true
dataventura-model.workspace = true
arrow = { workspace = true }
datafusion = { workspace = true, features = ["parquet", "sql", "datetime_expressions", "string_expressions", "unicode_expressions", "regex_expressions", "nested_expressions", "recursive_protection"] }
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
