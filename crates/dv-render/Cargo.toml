[package]
name = "dataventura-render"
description = "The wgpu renderer: fields, points, the dv-plot chart layer, text, motion and SVG/PDF/PNG export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_render"

[lints]
workspace = true

[dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
rayon = "1.12"
vello = "0.12"
parley = "0.13"
skrifa = "0.49"
icu_decimal = "2"
icu_locale_core = "2"
fixed_decimal = "0.7"

[dev-dependencies]
# float_roundtrip: reference values must parse to the exact doubles R wrote.
serde_json = { version = "1", features = ["float_roundtrip"] }
