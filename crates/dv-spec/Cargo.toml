[package]
name = "dataventura-spec"
description = "The .dvspec workspace format, its JSON Schema and lock files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_spec"

[lints]
workspace = true

[dependencies]
dataventura-model.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
toml = "1"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
serde_json = "1"
