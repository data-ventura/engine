# cargo-deny: run `cargo deny check` (installed in CI).
[graph]
all-features = true

[licenses]
# Permissive licenses only, so the engine stays Apache-2.0 compatible.
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "MPL-2.0", "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The engine must never depend on proprietary Data Ventura code or SourceRift's chassis.
deny = [
    { name = "dv-license" }, { name = "dv-mcp" }, { name = "dv-cli" }, { name = "dv-app-ffi" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
