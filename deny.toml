# cargo-deny: run `cargo deny check` (installed in CI).
[graph]
all-features = true

[licenses]
# Permissive licenses only, so the engine stays Apache-2.0 compatible.
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "MPL-2.0", "OFL-1.1",
]
confidence-threshold = 0.9
# Mozilla's root certificates, shipped as data (via reqwest's rustls verifier). CDLA-Permissive-2.0
# is a permissive data licence that puts no conditions on the code using it.
exceptions = [
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; none are published yet (see Cargo.toml).
allow-wildcard-paths = true
# The engine must never depend on proprietary Data Ventura code or SourceRift's chassis.
deny = [
    { name = "dv-license" }, { name = "dv-mcp" }, { name = "dv-cli" }, { name = "dv-app-ffi" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # Unmaintained, with no known vulnerability: a build-time macro crate that zarrs uses. Remove
    # once zarrs moves off it.
    { id = "RUSTSEC-2024-0436", reason = "build-time only, pulled in by zarrs" },
    # Unmaintained, with no known vulnerability: the YAML parser under serde_yaml_ng, which the
    # icechunk crate uses for its configuration files. The engine only reads repositories and
    # never parses Icechunk YAML. Remove once icechunk moves off it.
    { id = "RUSTSEC-2024-0449", reason = "icechunk's YAML config, unused by the engine" },
]
