[package]
name = "dataventura-spike"
description = "The M0 spike: benchmark harness and one binary per pass criterion (S1-S12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dv_spike"

[lints]
workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dataventura-data.workspace = true
dataventura-model.workspace = true
dataventura-grid.workspace = true
dataventura-render.workspace = true
arrow = { version = "60.1", default-features = false }
rayon = "1.12"
wgpu = "30"
png = "0.18"
# S5 only: rasterizes the SVG export to compare it with the screen. No text or fonts needed: the
# export draws glyphs as outlines.
resvg = { version = "0.50", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zarrs_object_store = { version = "0.7", default-features = false, features = ["http"] }
